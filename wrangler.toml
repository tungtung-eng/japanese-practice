# 日語隨身練 —— 每日三句推播伺服器（Cloudflare Worker）
# 網頁本身放在 GitHub Pages，這個 Worker 只負責推播。
# 部署：雙擊「部署推播伺服器.bat」

name = "japanese-practice-push"
main = "worker/index.js"
compatibility_date = "2026-09-01"

# 訂閱資料（哪些手機要收通知）
# id 是 deploy.ps1 第一次部署時自動建立的
[[kv_namespaces]]
binding = "SUBS"
id = "daa9992c046b4bb8bdf3a19a092cee63"

# 排程：不用自己的排程。
# Cloudflare 免費方案「整個帳號」最多 5 個排程，已經用滿了，
# 所以改由工地氣象站（每 10 分鐘跑一次）順便呼叫這裡的 /tick，
# 由 worker/index.js 判斷現在是不是 09:00、11:30、20:00（台灣時間）該送的時候。
# crons 留空，部署時會把之前設到一半的排程清掉。
[triggers]
crons = []

# VAPID 金鑰不寫在這裡，用 secret 存（deploy.ps1 會自動產生並上傳）：
#   VAPID_PUBLIC、VAPID_PRIVATE
